{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.maxRequestSize }}
{{ include "common.requiredAnnotations" . | indent 4 }}
  labels:
{{ include "common.requiredLabels" . | indent 4 }}
  name: {{ template "common.basename" . }}-ingress
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  rules:
  - host: {{ .Values.ingress.fqdn }}
    http:
      paths:
      - backend:
          service:
            name: {{ template "common.basename" . }}-service
            port:
              number: {{ .Values.servicePort }}
        path: /
        pathType: Prefix
{{- if .Values.ingress.tlsEnabled }}
  tls:
  - hosts:
    - {{ .Values.ingress.fqdn }}
    secretName: {{ .Values.ingress.secretName }}
{{- end }}
{{- end }}