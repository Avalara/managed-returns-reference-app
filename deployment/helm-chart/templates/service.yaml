apiVersion: v1
kind: Service
metadata:
  annotations:
{{ include "common.loggingAnnotation" . | indent 4 }}
{{ include "common.requiredAnnotations" . | indent 4 }}
  labels:
{{ include "common.requiredLabels" . | indent 4 }}
  name: {{ template "common.basename" . }}-service
spec:
  ports:
  - name: {{ coalesce .Values.servicePortName "service-port"}}
    port: {{ .Values.servicePort }}
    targetPort: {{ .Values.containerPort }}
  selector:
    app: {{ template "common.basename" . }}
  type: ClusterIP