{{- if .Values.iamRoleARN }}
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
{{ include "common.loggingAnnotation" . | indent 4 }}
{{ include "common.requiredAnnotations" . | indent 4 }}
    eks.amazonaws.com/role-arn: {{ .Values.iamRoleARN }}
  labels:
{{ include "common.requiredLabels" . | indent 4 }}
  name: {{ template "common.basename" . }}-service-account
{{- end }}
