{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ template "common.basename" . }}
  annotations:
{{ include "common.loggingAnnotation" . | indent 4 }}
{{ include "common.requiredAnnotations" . | indent 4 }}
  labels:
{{ include "common.requiredLabels" . | indent 4 }}
spec:
  endpoints:
  - interval: {{ .Values.serviceMonitor.interval }}
    path: {{ .Values.serviceMonitor.path }}
    port: {{ .Values.servicePortName }}
    scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ template "common.basename" . }}
{{- end }}